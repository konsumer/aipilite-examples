[env]
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; esptool 5.x required in PATH — platform's bundled 4.x doesn't support ESP32-S3 USB JTAG reliably
upload_protocol = custom
upload_command = esptool --chip esp32s3 write-flash 0x0 $BUILD_DIR/bootloader.bin 0x8000 $BUILD_DIR/partitions.bin 0x10000 $SOURCE
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board_build.arduino.memory_type = qio_opi
build_flags =
    -DESP32S3
    -DCORE_DEBUG_LEVEL=2
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM

[env:basic]
build_src_filter = +<basic/>
lib_deps =
    https://github.com/moononournation/Arduino_GFX

[env:sound]
build_src_filter = +<sound/>
lib_deps =
    https://github.com/moononournation/Arduino_GFX
    https://github.com/pschatzmann/arduino-audio-driver
    https://github.com/pschatzmann/arduino-audio-tools

[env:rgb]
build_src_filter = +<rgb/>
lib_deps =
    fastled/FastLED@^3.6.0

[env:battery]
build_src_filter = +<battery/>
lib_deps =
    https://github.com/moononournation/Arduino_GFX
